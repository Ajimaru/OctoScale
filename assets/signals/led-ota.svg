    <circle cx="60" cy="60" r="20" fill="#2f8fe0"><animate attributeName="opacity" values="1;1;0.08;0.08" keyTimes="0;0.499;0.5;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/></circle>
