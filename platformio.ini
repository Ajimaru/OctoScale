; PlatformIO Project Configuration File
; OctoScale — Scale + NFC + WiFi/OTA
;
; ONLY target: ESP32-S3-N16R8 (dual-core, 16MB flash / 8MB PSRAM).
; Legacy targets (S2 Mini, WROOM-32U) removed — S3-only project.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
	tzapu/WiFiManager@^2.0.17
	bogde/HX711@^0.7.5
	adafruit/Adafruit NeoPixel@^1.12.3
	bblanchon/ArduinoJson@^7.0.0

; ===== ESP32-S3-N16R8 (dual-core, 16MB flash / 8MB PSRAM) =====
; Board has a WCH CH343 USB-UART on UART0 -> Serial = UART0 (wchusbserial port),
; NOT native USB-CDC. Hence ARDUINO_USB_CDC_ON_BOOT=0: with =1 the core remaps
; Serial to the S3's native USB-CDC, whose init hangs boot before setup() on
; this board (no setup prints, only ROM log).
; Shared base (inherited by esp32s3 + esp32s3_ota): board, PSRAM config and ALL
; build_flags (incl. TFT_eSPI) in one place -> USB and OTA envs stay identical.
[s3_base]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
; TFT_eSPI configured ENTIRELY via flags (USER_SETUP_LOADED=1 -> the lib's own
; User_Setup.h is ignored). ST7789 320x240, pins = S3 wiring.
; CDC_ON_BOOT=0 mandatory (else boot hang, see comment above) - applies to OTA too.
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=TFT_BGR  ; panel is BGR: without this red/blue swap (test: red->blue, cyan->yellow)
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	; TFT on its OWN SPI pins (separate from the PN5180 bus 11/12/13), else bus
	; conflict: with shared pins the PN5180 stops reading. Display is write-only
	; -> MISO unused (-1). SCK=42, MOSI=44 (free GPIOs).
	-DTFT_MOSI=44
	-DTFT_SCLK=42
	-DTFT_MISO=-1
	-DTFT_CS=38
	-DTFT_DC=39
	-DTFT_RST=40
	; TFT_BL deliberately NOT given to TFT_eSPI: else g_tft.init() hard-drives the
	; pin HIGH and overrides our LEDC PWM -> no brightness control. We drive the
	; backlight (GPIO 41) entirely ourselves via LEDC (displayInit/displaySetBacklight).
	-DTFT_BL_PIN=41
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1  ; large 7-segment digits (weight readout in the TFT menu)
	-DSMOOTH_FONT=1 ; antialiased fonts (VLW array NotoSansBold36 for weight/type)
	; S3: force an explicit SPI port. Without this tft.init() picked the wrong
	; SPI host -> StoreProhibited panic (boot loop).
	; Frequency: 27 MHz was the bring-up value and was never validated. Lowered to
	; 20 MHz on 2026-09-15 while chasing intermittent screensaver corruption -- that
	; is the most SPI-intensive state (a 90x90 blit every 30 ms for hours), so a
	; marginal bus shows up there first. If corruption persists at 20 MHz the bus is
	; NOT the cause and this can go back up; if it disappears, the real fix is signal
	; integrity (lead length, series resistors), not living at a lower clock.
	-DUSE_HSPI_PORT=1
	-DSPI_FREQUENCY=20000000
; PN5180 Library is vendored in lib/ (NOT lib_deps -> registry download): it carries
; several local patches. Most important are timeouts on the four unbounded wait loops
; (BUSY pin in transceiveCommand, plus the IRQ waits in setRF_on/setRF_off/reset) -- any
; of them can spin forever on a non-conforming tag or an unresponsive chip, which starves
; pn5180Task on core 0 -> Task Watchdog reboot with no log. Upstream is archived and
; never fixed these (1.8.1 is its final release); the registry only ever had 1.5.
; See lib/README-patch.md for the full list and the attribution of the adopted fixes.
; PlatformIO always prefers a project-local lib/ over lib_deps of the same name, so
; leaving PN5180 out of lib_deps here keeps this pin the single source of truth.
lib_deps =
	${env.lib_deps}
	bodmer/TFT_eSPI@^2.5.43

; USB flash: pio run -e esp32s3 -t upload
[env:esp32s3]
extends = s3_base
upload_port = /dev/cu.wchusbserial5C372519431
monitor_port = /dev/cu.wchusbserial5C372519431

; OTA flash (ESP runs on external power, no USB): pio run -e esp32s3_ota -t upload
; IMPORTANT: override upload_port via CLI (device IP instead of octoscale.local -> mDNS latency):
;   pio run -e esp32s3_ota -t upload --upload-port <device-ip>
[env:esp32s3_ota]
extends = s3_base
upload_protocol = espota
upload_port = octoscale.local
upload_flags =
	--port=3232
	--timeout=30
